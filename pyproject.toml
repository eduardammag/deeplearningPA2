[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mot-pa2"
version = "0.1.0"
description = "Identity-aware multi-object tracking for Deep Learning PA2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "scipy>=1.10", "matplotlib>=3.7", "pillow>=9.5"]

[project.optional-dependencies]
full = ["torchvision>=0.15", "jupyter>=1.0", "opencv-python>=4.8"]

test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools]
package-dir = {"" = ".", mot_pa2 = "src/mot_pa2"}
py-modules = ["metrics"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mot_pa2*"]
